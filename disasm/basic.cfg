; da65 config skeleton for Microsoft 6502 BASIC 8K
; Adjust ranges after inspecting initial disassembly.

SYS     CPU     6502

; Assume load address 0x0800 (Apple II variant) - adjust if different.
SEGMENT CODE    START $0800

; Vector symbols (example addresses, update as confirmed)
SYMBOL  INIT    $0800
; Add more as discovered

; Zero page usage (placeholder; refine)
SYMBOL  TXTPTR  $00
SYMBOL  VARTAB  $2D

; Ranges: declare initial code region; data regions will be carved out.
RANGE CODE $0800 $1FFF
